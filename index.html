        e.preventDefault();
        setLoginError('');

        const found = users.find(
          u => u.username.toLowerCase() === loginForm.username.trim().toLowerCase() && 
               u.password === loginForm.password &&
               u.status === 'Ativo'
        );

        if (found) {
          setSessionUser(found);
          localStorage.setItem('tb_sessionUser', JSON.stringify(found));
          setLoginForm({ username: '', password: '' });
        } else {
          setLoginError('Usuário ou senha incorretos, ou cadastro inativo.');
        }
      };

      const handleLogout = () => {
        setSessionUser(null);
        localStorage.removeItem('tb_sessionUser');
      };

      const isSuperAdmin = sessionUser?.role === 'SUPER_ADM';
      const isStoreAdmin = sessionUser?.role === 'ADM_LOJA' || isSuperAdmin;
      const isRestrictedUser = !isStoreAdmin;

      const [selectedSupplier, setSelectedSupplier] = useState('ALL');
      const [copiedAlert, setCopiedAlert] = useState(false);

        if (sessionUser) {
          if (isRestrictedUser) {

            } else if (sessionUser.pracaAccess === 'cozinha') {

      useEffect(() => { localStorage.setItem('tb_pracas', JSON.stringify(pracas)); }, [pracas]);
      useEffect(() => { localStorage.setItem('tb_suppliers', JSON.stringify(suppliers)); }, [suppliers]);
      useEffect(() => { localStorage.setItem('tb_users', JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem('tb_stores', JSON.stringify(stores)); }, [stores]);
      useEffect(() => { localStorage.setItem('tb_storeInfo', JSON.stringify(storeInfo)); }, [storeInfo]);

      const [newUser, setNewUser] = useState({ 
        username: '', password: '', name: '', whatsapp: '', role: 'COZINHA', storeName: 'THE BURGER - Matriz', pracaAccess: 'cozinha', status: 'Ativo' 
      });

      const [newPraca, setNewPraca] = useState({ name: '', active: true });
      const [newSupplier, setNewSupplier] = useState({ name: '', phone: '', category: '' });

      const [newProduct, setNewProduct] = useState({
        name: '', minEstq: '', supplier: '', praca: 'salao', fardo: '12', fridge: '0', deposit: '0', currentQty: '0'
      });

      useEffect(() => {
        if (sessionUser && isRestrictedUser) {
          setNewProduct(prev => ({ ...prev, praca: sessionUser.pracaAccess }));
        }
      }, [sessionUser, isRestrictedUser]);

      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState(null);

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            alert('A imagem é muito grande! Escolha um arquivo de até 2MB.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setStoreInfo(prev => ({ ...prev, logoUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRemoveLogo = () => {
        setStoreInfo(prev => ({ ...prev, logoUrl: null }));
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUser.name || !newUser.username || !newUser.password) {
          alert('Preencha os campos obrigatórios: Nome, Usuário e Senha.');
          return;
        }

        if (users.some(u => u.username.toLowerCase() === newUser.username.trim().toLowerCase())) {
          alert('Este nome de usuário já está cadastrado!');
          return;
        }

        setUsers(prev => [...prev, { id: Date.now().toString(), ...newUser, username: newUser.username.trim().toLowerCase() }]);
        setNewUser({ username: '', password: '', name: '', whatsapp: '', role: 'COZINHA', storeName: storeInfo.name, pracaAccess: 'cozinha', status: 'Ativo' });
      };

      const handleDeleteUser = (id) => {
        if (id === 'super-adm') {
          alert('A conta do Super Administrador não pode ser deletada.');
          return;
        }
        setUsers(prev => prev.filter(u => u.id !== id));
        if (sessionUser?.id === id) handleLogout();
      };

      const toggleUserStatus = (id) => {
        if (id === 'super-adm') return;
        setUsers(prev => prev.map(u => u.id === id ? { ...u, status: u.status === 'Ativo' ? 'Inativo' : 'Ativo' } : u));
      };

      const handleAddPraca = (e) => {
        e.preventDefault();
        if (!newPraca.name) return;
        const id = newPraca.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
        setPracas(prev => [...prev, { id, name: newPraca.name, icon: 'Layers', active: true }]);
        setNewPraca({ name: '', active: true });
      };

      const togglePracaActive = (id) => {
        setPracas(prev => prev.map(p => p.id === id ? { ...p, active: !p.active } : p));
      };

      const handleDeletePraca = (id) => {
        if (id === 'salao' || id === 'cozinha') {
          alert('As praças padrão "Salão" e "Cozinha" não podem ser removidas.');
          return;
        }
        setPracas(prev => prev.filter(p => p.id !== id));
      };

      const handleAddSupplier = (e) => {
        e.preventDefault();
        if (!newSupplier.name) return;
        setSuppliers(prev => [...prev, { id: Date.now().toString(), ...newSupplier }]);
        setNewSupplier({ name: '', phone: '', category: '' });
      };

      const handleDeleteSupplier = (id) => {
        setSuppliers(prev => prev.filter(s => s.id !== id));
      };

      const updateProductQty = (id, field, value) => {
        const numericVal = Math.max(0, parseFloat(value) || 0);
        setProducts(prev => prev.map(p => p.id === id ? { ...p, [field]: numericVal } : p));
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.name || !newProduct.supplier) return;

        const targetPraca = isStoreAdmin ? newProduct.praca : sessionUser.pracaAccess;
        const pracaObj = pracas.find(p => p.id === targetPraca);

        if (pracaObj && !pracaObj.active) {
          alert(`A praça "${pracaObj.name}" está temporariamente desativada pelo administrador.`);
          return;
        }

        const minEstq = parseFloat(newProduct.minEstq) || 0;
        const fardo = parseInt(newProduct.fardo) || 1;

        const newItem = {
          id: Date.now().toString(),
          name: newProduct.name.toUpperCase(),
          minEstq,
          supplier: newProduct.supplier,
          praca: targetPraca,
          fardo: targetPraca === 'salao' ? fardo : 1,
          ...(targetPraca === 'salao' 
            ? { fridge: parseFloat(newProduct.fridge) || 0, deposit: parseFloat(newProduct.deposit) || 0 }
            : { currentQty: parseFloat(newProduct.currentQty) || 0 }
          )
        };

        setProducts(prev => [...prev, newItem]);
        setNewProduct({ name: '', minEstq: '', supplier: '', praca: targetPraca, fardo: '12', fridge: '0', deposit: '0', currentQty: '0' });
        setActiveTab(targetPraca);
      };

      const handleDeleteProduct = (id) => {
        setProducts(prev => prev.filter(p => p.id !== id));
      };

      const startEditing = (product) => {
        setEditingId(product.id);
        setEditForm({ ...product });
      };

      const saveEditing = () => {
        setProducts(prev => prev.map(p => p.id === editingId ? editForm : p));
        setEditingId(null);
        setEditForm(null);
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (activeTab === 'salao' && p.praca !== 'salao') return false;
          if (activeTab === 'cozinha' && p.praca !== 'cozinha') return false;

          const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                p.supplier.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesSupplier = selectedSupplier === 'ALL' || p.supplier === selectedSupplier;

          return matchesSearch && matchesSupplier;
        });
      }, [products, activeTab, searchTerm, selectedSupplier]);

      const missingProducts = useMemo(() => {
        return products.map(p => {
          const total = p.praca === 'salao' ? (p.fridge + p.deposit) : p.currentQty;
          const falta = p.minEstq - total;
          const fardosFalta = p.fardo > 0 ? Math.ceil(falta / p.fardo) : 0;
          return { ...p, total, falta, fardosFalta };
        }).filter(p => p.falta > 0);
      }, [products]);

      const missingBySupplier = useMemo(() => {
        const groups = {};
        missingProducts.forEach(p => {
          if (!groups[p.supplier]) groups[p.supplier] = [];
          groups[p.supplier].push(p);
        });
        return groups;
      }, [missingProducts]);

      const copyShoppingList = () => {
        let text = `📋 *PEDIDO DE COMPRAS - ${storeInfo.name.toUpperCase()}*\n`;
        text += `Data: ${new Date().toLocaleDateString('pt-BR')}\n\n`;

        Object.keys(missingBySupplier).forEach(supplier => {
          const foundSupplier = suppliers.find(s => s.name.toLowerCase() === supplier.toLowerCase());
          const wpp = foundSupplier?.phone ? ` (Wpp: ${foundSupplier.phone})` : '';
          text += `🏢 *FORNECEDOR: ${supplier.toUpperCase()}*${wpp}\n`;
          missingBySupplier[supplier].forEach(item => {
            if (item.praca === 'salao') {
              text += ` • ${item.name}: Falta ${item.falta} un (${item.fardosFalta} fardos c/ ${item.fardo})\n`;
            } else {
              text += ` • ${item.name}: Falta ${item.falta} un\n`;
            }
          });
          text += `\n`;
        });

        navigator.clipboard.writeText(text);
        setCopiedAlert(true);
        setTimeout(() => setCopiedAlert(false), 3000);
      };

      const totalSalaoFalta = useMemo(() => {
        return products.filter(p => p.praca === 'salao').reduce((acc, p) => {
          const total = p.fridge + p.deposit;
          return acc + (p.minEstq > total ? (p.minEstq - total) : 0);
        }, 0);
      }, [products]);

      const totalCozinhaFalta = useMemo(() => {
        return products.filter(p => p.praca === 'cozinha').reduce((acc, p) => {
          return acc + (p.minEstq > p.currentQty ? (p.minEstq - p.currentQty) : 0);
        }, 0);
      }, [products]);

      if (!sessionUser) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-500 via-cyan-500 to-amber-500"></div>
              
              <div className="text-center mb-8">
                {storeInfo.logoUrl ? (
                  <img src={storeInfo.logoUrl} alt="Logo" className="w-20 h-20 mx-auto rounded-2xl object-cover mb-3 border-2 border-amber-500/30" />
                ) : (
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 text-slate-950 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/20">
                    <Store className="w-9 h-9 font-bold" />
                  </div>
                )}
                <h1 className="text-2xl font-black text-white tracking-tight">{storeInfo.name}</h1>
                <p className="text-xs text-slate-400 mt-1">Sistema de Controle de Estoque & Praças</p>
              </div>

              {loginError && (
                <div className="mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs p-3 rounded-xl flex items-center gap-2">
                  <AlertTriangle className="w-4 h-4 shrink-0" />
                  <span>{loginError}</span>
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Usuário</label>
                  <div className="relative">
                    <Users className="w-4 h-4 text-slate-500 absolute left-3.5 top-3" />
                    <input
                      type="text"
                      required
                      placeholder="Ex: superadm, cozinha, salao"
                      value={loginForm.username}
                      onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition-colors"
                    />
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Senha</label>
                    <button
                      type="button"
                      onClick={() => {
                        setShowForgotPasswordModal(true);
                        setForgotSuccessMessage('');
                        setForgotUsername('');
                      }}
                      className="text-xs text-amber-400 hover:text-amber-300 hover:underline transition-colors font-medium"
                    >
                      Esqueci a senha
                    </button>
                  </div>
                  <div className="relative">
                    <Lock className="w-4 h-4 text-slate-500 absolute left-3.5 top-3" />
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={loginForm.password}
                      onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition-colors"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-sm mt-2"
                >
                  <KeyRound className="w-4 h-4" />
                  Entrar no Sistema
                </button>
              </form>
            </div>

            {/* Modal de Recuperação de Senha */}
            {showForgotPasswordModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
                  <button
                    onClick={() => setShowForgotPasswordModal(false)}
                    className="absolute top-4 right-4 text-slate-400 hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>

                  <div className="flex items-center gap-3 mb-4">
                    <div className="p-2.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20">
                      <KeyRound className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-white text-base">Recuperar Senha</h3>
                      <p className="text-xs text-slate-400">Solicitar redefinição de acesso</p>
                    </div>
                  </div>

                  {forgotSuccessMessage ? (
                    <div className="space-y-4">
                      <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs p-3 rounded-xl flex items-center gap-2">
                        <CheckCircle2 className="w-4 h-4 shrink-0" />
                        <span>{forgotSuccessMessage}</span>
                      </div>
                      {storeInfo.whatsapp && (
                        <a
                          href={`https://wa.me/55${storeInfo.whatsapp.replace(/\D/g, '')}?text=Olá,%20esqueci%20minha%20senha%20do%20sistema%20(Usuário:%20${encodeURIComponent(forgotUsername)})`}
                          target="_blank"
                          rel="noreferrer"
                          className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg transition-all"
                        >
                          <Phone className="w-4 h-4" /> Enviar mensagem no WhatsApp do ADM
                        </a>
                      )}
                      <button
                        onClick={() => setShowForgotPasswordModal(false)}
                        className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-xl text-xs"
                      >
                        Fechar
                      </button>
                    </div>
                  ) : (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        const userFound = users.find(u => u.username.toLowerCase() === forgotUsername.trim().toLowerCase());
                        if (userFound) {
                          setForgotSuccessMessage(`Instruções registradas para o usuário "${userFound.username}". Entre em contato com o Super ADM para liberar o novo acesso.`);
                        } else {
                          setForgotSuccessMessage(`Solicitação iniciada. Favor contatar o administrador responsável para redefinir.`);
                        }
                      }}
                      className="space-y-4"
                    >
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Informe seu Usuário</label>
                        <input
                          type="text"
                          required
                          placeholder="Digite seu nome de usuário"
                          value={forgotUsername}
                          onChange={(e) => setForgotUsername(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg transition-all"
                      >
                        Solicitar Recuperação
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const userPracaObj = pracas.find(p => p.id === sessionUser.pracaAccess);
      const isPracaBlocked = isRestrictedUser && userPracaObj && !userPracaObj.active;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-12 selection:bg-amber-500 selection:text-slate-950">
          <div className="bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs flex flex-col sm:flex-row items-center justify-between gap-2">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1.5 text-amber-400 font-bold">
                <ShieldCheck className="w-4 h-4 text-amber-400" />
                <span>{sessionUser.name}</span>
              </div>
              <span className="text-slate-500">|</span>
              <span className="text-slate-300 font-medium flex items-center gap-1">
                <Store className="w-3.5 h-3.5 text-slate-400" /> {sessionUser.storeName}
              </span>
              <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase border ${
                isSuperAdmin ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' :
                isStoreAdmin ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40' :
                'bg-slate-800 text-slate-300 border-slate-700'
              }`}>
                {sessionUser.role}
              </span>
            </div>

            <button
              onClick={handleLogout}
              className="flex items-center gap-1.5 text-slate-400 hover:text-rose-400 font-semibold transition-colors bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800"
            >
              <LogOut className="w-3.5 h-3.5" /> Sair
            </button>
          </div>

          <header className="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-30 shadow-xl backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div className="flex items-center space-x-3">
                  {storeInfo.logoUrl ? (
                    <div className="w-11 h-11 rounded-xl bg-slate-800 overflow-hidden border border-amber-500/30 flex items-center justify-center p-0.5 shadow-lg">
                      <img src={storeInfo.logoUrl} alt="Logo" className="w-full h-full object-cover rounded-lg" />
                    </div>
                  ) : (
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/20 font-bold">
                      <Store className="w-6 h-6" />
                    </div>
                  )}
                  <div>
                    <h1 className="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                      {storeInfo.name}
                    </h1>
                    <p className="text-xs text-slate-400">Controle de Estoque & Liberacão de Praças</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 sm:gap-4 overflow-x-auto pb-1 md:pb-0">
                  {(isStoreAdmin || sessionUser.pracaAccess === 'salao') && (
                    <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50 text-xs">
                      <Refrigerator className="w-4 h-4 text-cyan-400" />
                      <span className="text-slate-300">Falta Salão:</span>
                      <span className={`font-bold ${totalSalaoFalta > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {totalSalaoFalta} un
                      </span>
                    </div>
                  )}

                  {(isStoreAdmin || sessionUser.pracaAccess === 'cozinha') && (
                    <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50 text-xs">
                      <UtensilsCrossed className="w-4 h-4 text-amber-400" />
                      <span className="text-slate-300">Falta Cozinha:</span>
                      <span className={`font-bold ${totalCozinhaFalta > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {totalCozinhaFalta} un
                      </span>
                    </div>
                  )}

                  {isStoreAdmin && (
                    <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50 text-xs">
                      <ShoppingCart className="w-4 h-4 text-emerald-400" />
                      <span className="text-slate-300">Itens p/ Comprar:</span>
                      <span className="font-bold text-amber-400">
                        {missingProducts.length}
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            {isPracaBlocked && (
              <div className="mb-6 bg-rose-950/40 border-2 border-rose-500/50 rounded-2xl p-6 text-center text-rose-200">
                <ShieldAlert className="w-12 h-12 text-rose-400 mx-auto mb-2 animate-bounce" />
                <h3 className="text-lg font-bold">Praça Temporariamente Desativada</h3>
                <p className="text-xs text-rose-300 mt-1 max-w-md mx-auto">
                  A praça <b>{userPracaObj.name}</b> foi bloqueada para atualização pelo Administrador.
                </p>
              </div>
            )}

            {!isPracaBlocked && (
              <div className="flex flex-wrap items-center justify-between gap-3 mb-6 border-b border-slate-800 pb-4">
                <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto">
                  {(isStoreAdmin || sessionUser.pracaAccess === 'salao') && (
                    <button
                      onClick={() => setActiveTab('salao')}
                      className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                        activeTab === 'salao'
                          ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20'
                          : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      <Refrigerator className="w-4 h-4" /> Conferência Salão
                    </button>
                  )}

                  {(isStoreAdmin || sessionUser.pracaAccess === 'cozinha') && (
                    <button
                      onClick={() => setActiveTab('cozinha')}
                      className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                        activeTab === 'cozinha'
                          ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20'
                          : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      <UtensilsCrossed className="w-4 h-4" /> Conferência Cozinha
                    </button>
                  )}

                  {isStoreAdmin && (
                    <button
                      onClick={() => setActiveTab('relatorio')}
                      className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap relative ${
                        activeTab === 'relatorio'
                          ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20'
                          : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      <ShoppingCart className="w-4 h-4" /> Relatório de Compras
                      {missingProducts.length > 0 && (
                        <span className={`ml-1 px-2 py-0.5 text-xs rounded-full ${activeTab === 'relatorio' ? 'bg-slate-950 text-amber-400' : 'bg-rose-500 text-white'}`}>
                          {missingProducts.length}
                        </span>
                      )}
                    </button>
                  )}

                  <button
                    onClick={() => setActiveTab('cadastrar')}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                      activeTab === 'cadastrar'
                        ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20'
                        : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    <PlusCircle className="w-4 h-4" /> Cadastrar Produto
                  </button>

                  {isStoreAdmin && (
                    <button
                      onClick={() => setActiveTab('config')}
                      className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-medium text-sm transition-all whitespace-nowrap ${
                        activeTab === 'config'
                          ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/20'
                          : 'bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      <Settings className="w-4 h-4" /> Configurações & Usuários
                    </button>
                  )}
                </div>
              </div>
            )}

            {!isPracaBlocked && (activeTab === 'salao' || activeTab === 'cozinha') && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6 bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                <div className="relative md:col-span-2">
                  <Search className="absolute left-3.5 top-3 w-4 h-4 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Buscar produto por nome ou fornecedor..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition-colors"
                  />
                </div>

                <div className="relative">
                  <Filter className="absolute left-3.5 top-3 w-4 h-4 text-slate-400" />
                  <select
                    value={selectedSupplier}
                    onChange={(e) => setSelectedSupplier(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition-colors appearance-none cursor-pointer"
                  >
                    <option value="ALL">Todos os Fornecedores</option>
                    {suppliers.map(sup => (
                      <option key={sup.id} value={sup.name}>{sup.name}</option>
                    ))}
                  </select>
                </div>
              </div>
            )}

            {/* ABA SALÃO */}
            {!isPracaBlocked && activeTab === 'salao' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <div>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <Refrigerator className="text-cyan-400 w-5 h-5" /> Conferência de Bebidas (Salão)
                    </h2>
                  </div>
                  <span className="text-xs font-semibold px-3 py-1 bg-slate-800 text-slate-300 rounded-lg border border-slate-700">
                    {filteredProducts.length} itens
                  </span>
                </div>

                <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/50 backdrop-blur shadow-2xl">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-900 border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                        <th className="py-3.5 px-4">Nome do Produto</th>
                        <th className="py-3.5 px-3 text-center">Mínimo</th>
                        <th className="py-3.5 px-3 text-center bg-cyan-950/30 text-cyan-400 border-x border-slate-800">Geladeira</th>
                        <th className="py-3.5 px-3 text-center bg-blue-950/30 text-blue-400 border-r border-slate-800">Depósito</th>
                        <th className="py-3.5 px-3 text-center">Tem (Total)</th>
                        <th className="py-3.5 px-3 text-center">Falta</th>
                        <th className="py-3.5 px-3 text-center">Fardos p/ Comprar</th>
                        <th className="py-3.5 px-4 text-right">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {filteredProducts.map((p) => {
                        const totalTem = p.fridge + p.deposit;
                        const falta = p.minEstq - totalTem;
                        const isAlert = falta > 0;
                        const fardosComprar = (p.fardo && p.fardo > 0 && falta > 0) ? Math.ceil(falta / p.fardo) : 0;
                        const isEditing = editingId === p.id;

                        return (
                          <tr key={p.id} className={`hover:bg-slate-800/40 transition-colors ${isAlert ? 'bg-rose-950/10' : ''}`}>
                            <td className="py-3 px-4 font-medium text-slate-200">
                              {isEditing ? (
                                <input
                                  type="text"
                                  value={editForm.name}
                                  onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
                                  className="bg-slate-950 border border-amber-500 rounded px-2 py-1 text-xs w-full"
                                />
                              ) : (
                                <div>
                                  <div className="font-semibold text-slate-100">{p.name}</div>
                                  <div className="text-[11px] text-slate-400 font-normal">{p.supplier}</div>
                                </div>
                              )}
                            </td>
                            <td className="py-3 px-3 text-center font-semibold text-slate-300">
                              {isEditing ? (
                                <input
                                  type="number"
                                  value={editForm.minEstq}
                                  onChange={(e) => setEditForm({ ...editForm, minEstq: parseFloat(e.target.value) || 0 })}
                                  className="bg-slate-950 border border-amber-500 rounded px-1.5 py-1 text-xs w-16 text-center"
                                />
                              ) : p.minEstq}
                            </td>
                            <td className="py-2 px-3 text-center bg-cyan-950/20 border-x border-slate-800/80">
                              <div className="flex items-center justify-center gap-1">
                                <button onClick={() => updateProductQty(p.id, 'fridge', p.fridge - 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-cyan-600 text-slate-300 text-xs font-bold">-</button>
                                <input type="number" value={p.fridge} onChange={(e) => updateProductQty(p.id, 'fridge', e.target.value)} className="w-12 text-center bg-slate-950 border border-slate-700 rounded py-1 text-cyan-300 font-bold" />
                                <button onClick={() => updateProductQty(p.id, 'fridge', p.fridge + 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-cyan-600 text-slate-300 text-xs font-bold">+</button>
                              </div>
                            </td>
                            <td className="py-2 px-3 text-center bg-blue-950/20 border-r border-slate-800/80">
                              <div className="flex items-center justify-center gap-1">
                                <button onClick={() => updateProductQty(p.id, 'deposit', p.deposit - 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-blue-600 text-slate-300 text-xs font-bold">-</button>
                                <input type="number" value={p.deposit} onChange={(e) => updateProductQty(p.id, 'deposit', e.target.value)} className="w-12 text-center bg-slate-950 border border-slate-700 rounded py-1 text-blue-300 font-bold" />
                                <button onClick={() => updateProductQty(p.id, 'deposit', p.deposit + 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-blue-600 text-slate-300 text-xs font-bold">+</button>
                              </div>
                            </td>
                            <td className="py-3 px-3 text-center font-bold text-slate-100 text-base">{totalTem}</td>
                            <td className="py-3 px-3 text-center">
                              {isAlert ? (
                                <span className="inline-flex items-center gap-1 font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded-md text-xs">
                                  <AlertTriangle className="w-3 h-3" /> {falta}
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md text-xs">
                                  <CheckCircle2 className="w-3 h-3" /> OK
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-3 text-center">
                              {fardosComprar > 0 ? (
                                <span className="font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-lg text-xs">
                                  {fardosComprar} fardos
                                </span>
                              ) : <span className="text-slate-600">-</span>}
                            </td>
                            <td className="py-3 px-4 text-right">
                              <div className="flex items-center justify-end gap-1">
                                {isEditing ? (
                                  <>
                                    <button onClick={saveEditing} className="p-1.5 text-emerald-400 hover:bg-slate-800 rounded"><Save className="w-4 h-4" /></button>
                                    <button onClick={() => setEditingId(null)} className="p-1.5 text-slate-400 hover:bg-slate-800 rounded"><X className="w-4 h-4" /></button>
                                  </>
                                ) : (
                                  <>
                                    <button onClick={() => startEditing(p)} className="p-1.5 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded"><Edit2 className="w-4 h-4" /></button>
                                    <button onClick={() => handleDeleteProduct(p.id)} className="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded"><Trash2 className="w-4 h-4" /></button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ABA COZINHA */}
            {!isPracaBlocked && activeTab === 'cozinha' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <UtensilsCrossed className="text-amber-400 w-5 h-5" /> Conferência de Insumos (Cozinha)
                  </h2>
                </div>

                <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/50 backdrop-blur shadow-2xl">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-900 border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                        <th className="py-3.5 px-4">Nome do Insumo</th>
                        <th className="py-3.5 px-4">Fornecedor</th>
                        <th className="py-3.5 px-3 text-center">Mínimo</th>
                        <th className="py-3.5 px-3 text-center bg-amber-950/20 text-amber-400 border-x border-slate-800">Tem</th>
                        <th className="py-3.5 px-3 text-center">Falta</th>
                        <th className="py-3.5 px-4 text-right">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {filteredProducts.map((p) => {
                        const falta = p.minEstq - p.currentQty;
                        const isAlert = falta > 0;
                        const isEditing = editingId === p.id;

                        return (
                          <tr key={p.id} className={`hover:bg-slate-800/40 transition-colors ${isAlert ? 'bg-rose-950/10' : ''}`}>
                            <td className="py-3 px-4 font-semibold text-slate-100">
                              {isEditing ? (
                                <input type="text" value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="bg-slate-950 border border-amber-500 rounded px-2 py-1 text-xs w-full" />
                              ) : p.name}
                            </td>
                            <td className="py-3 px-4 text-slate-400 text-xs">{p.supplier}</td>
                            <td className="py-3 px-3 text-center font-semibold text-slate-300">
                              {isEditing ? (
                                <input type="number" step="0.1" value={editForm.minEstq} onChange={(e) => setEditForm({ ...editForm, minEstq: parseFloat(e.target.value) || 0 })} className="bg-slate-950 border border-amber-500 rounded px-1.5 py-1 text-xs w-16 text-center" />
                              ) : p.minEstq}
                            </td>
                            <td className="py-2 px-3 text-center bg-amber-950/10 border-x border-slate-800/80">
                              <div className="flex items-center justify-center gap-1">
                                <button onClick={() => updateProductQty(p.id, 'currentQty', p.currentQty - 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-amber-500 text-slate-300 text-xs font-bold">-</button>
                                <input type="number" step="0.1" value={p.currentQty} onChange={(e) => updateProductQty(p.id, 'currentQty', e.target.value)} className="w-16 text-center bg-slate-950 border border-slate-700 rounded py-1 text-amber-300 font-bold" />
                                <button onClick={() => updateProductQty(p.id, 'currentQty', p.currentQty + 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-amber-500 text-slate-300 text-xs font-bold">+</button>
                              </div>
                            </td>
                            <td className="py-3 px-3 text-center">
                              {isAlert ? (
                                <span className="inline-flex items-center gap-1 font-bold text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2.5 py-1 rounded-md text-xs">
                                  <AlertTriangle className="w-3.5 h-3.5" /> Falta {falta.toFixed(falta % 1 !== 0 ? 1 : 0)}
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-md text-xs">
                                  <CheckCircle2 className="w-3.5 h-3.5" /> OK
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-4 text-right">
                              <div className="flex items-center justify-end gap-1">
                                {isEditing ? (
                                  <>
                                    <button onClick={saveEditing} className="p-1.5 text-emerald-400 hover:bg-slate-800 rounded"><Save className="w-4 h-4" /></button>
                                    <button onClick={() => setEditingId(null)} className="p-1.5 text-slate-400 hover:bg-slate-800 rounded"><X className="w-4 h-4" /></button>
                                  </>
                                ) : (
                                  <>
                                    <button onClick={() => startEditing(p)} className="p-1.5 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded"><Edit2 className="w-4 h-4" /></button>
                                    <button onClick={() => handleDeleteProduct(p.id)} className="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded"><Trash2 className="w-4 h-4" /></button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ABA RELATÓRIO */}
            {!isPracaBlocked && activeTab === 'relatorio' && isStoreAdmin && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-slate-900 p-5 rounded-2xl border border-slate-800">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <ShoppingCart className="text-emerald-400 w-6 h-6" /> Relatório Integrado de Compras
                    </h2>
                  </div>
                  <button
                    onClick={copyShoppingList}
                    disabled={missingProducts.length === 0}
                    className="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg flex items-center gap-2"
                  >
                    {copiedAlert ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                    {copiedAlert ? 'Lista Copiada!' : 'Copiar Lista de Compras'}
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {Object.keys(missingBySupplier).map(supplier => (
                    <div key={supplier} className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                      <h3 className="font-bold text-amber-400 text-sm mb-3 uppercase flex items-center gap-2">
                        <Building2 className="w-4 h-4" /> {supplier}
                      </h3>
                      <ul className="divide-y divide-slate-800">
                        {missingBySupplier[supplier].map(item => (
                          <li key={item.id} className="py-2.5 flex items-center justify-between text-xs">
                            <span className="font-semibold text-slate-200">{item.name}</span>
                            <span className="font-bold text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20">
                              Falta: {item.falta.toFixed(item.falta % 1 !== 0 ? 1 : 0)} un
                            </span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ABA CADASTRO PRODUTO */}
            {!isPracaBlocked && activeTab === 'cadastrar' && (
              <div className="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <h2 className="text-lg font-bold text-white mb-4">Cadastrar Novo Produto</h2>
                <form onSubmit={handleAddProduct} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Nome do Produto *</label>
                    <input type="text" required value={newProduct.name} onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Praça *</label>
                      <select value={newProduct.praca} onChange={(e) => setNewProduct({ ...newProduct, praca: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100">
                        {pracas.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Fornecedor *</label>
                      <select required value={newProduct.supplier} onChange={(e) => setNewProduct({ ...newProduct, supplier: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100">
                        <option value="">Selecione...</option>
                        {suppliers.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Estoque Mínimo *</label>
                      <input type="number" step="0.1" required value={newProduct.minEstq} onChange={(e) => setNewProduct({ ...newProduct, minEstq: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100" />
                    </div>
                    {newProduct.praca === 'salao' && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Unidades / Fardo</label>
                        <input type="number" value={newProduct.fardo} onChange={(e) => setNewProduct({ ...newProduct, fardo: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100" />
                      </div>
                    )}
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm hover:bg-amber-400">Salvar Produto</button>
                </form>
              </div>
            )}

            {/* ABA CONFIGURAÇÕES */}
            {!isPracaBlocked && activeTab === 'config' && isStoreAdmin && (
              <div className="space-y-6 max-w-5xl mx-auto">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <h3 className="font-bold text-white mb-4">Gestão de Usuários</h3>
                  <form onSubmit={handleAddUser} className="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-6">
                    <input type="text" required placeholder="Usuário (login)" value={newUser.username} onChange={(e) => setNewUser({ ...newUser, username: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
                    <input type="password" required placeholder="Senha" value={newUser.password} onChange={(e) => setNewUser({ ...newUser, password: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
                    <input type="text" required placeholder="Nome Completo" value={newUser.name} onChange={(e) => setNewUser({ ...newUser, name: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
                    <button type="submit" className="bg-amber-500 text-slate-950 font-bold rounded-lg text-xs hover:bg-amber-400 py-2">Criar Usuário</button>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
